<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侘寂 - Grace in the Void</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    <div class="floating-elements" id="floatingElements"></div>
    
    <div class="top-nav">
        <button class="language-toggle" id="languageToggle" aria-label="切换语言" title="切换语言">
            <span id="languageIcon" aria-hidden="true">中</span>
        </button>
        
        <button class="theme-toggle" id="themeToggle" aria-label="切换明暗主题" title="切换明暗主题">
            <span id="themeIcon" aria-hidden="true">🌙</span>
        </button>
    </div>
    
    <section class="hero slide" id="home" data-slide="0">
        <div class="hero-background"></div>
        <div class="hero-content">
            <h1 class="hero-title">侘寂</h1>
            <p class="hero-slogan">Grace in the Void</p>
            <p class="hero-subtitle">在虚无中发现优雅，在不完美中寻找美的本质<br>Finding elegance in emptiness, discovering beauty in imperfection</p>
            
            <div class="cta-buttons">
                <button class="cta-btn primary" id="primaryBtn">静观</button>
                <button class="cta-btn secondary" id="secondaryBtn">冥想</button>
            </div>
        </div>

        <button class="scroll-cue" id="nextSlide" aria-label="前往下一页" title="前往下一页">
            <span aria-hidden="true">⌄</span>
        </button>
    </section>

    <section class="terminal-slide slide" id="terminal" data-slide="1">
        <div class="terminal-app" id="terminalWindow">
            <div class="terminal-toolbar">
                <div class="terminal-controls" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span class="terminal-title">Terminal</span>
            </div>
            <div class="terminal-body">
                <span class="terminal-prompt" aria-hidden="true">&gt;</span>
                <div class="terminal-editor" id="terminalEditor" contenteditable="true" role="textbox" aria-label="Terminal input" aria-multiline="true" autocapitalize="off" spellcheck="false"></div>
            </div>
        </div>
    </section>

    <nav class="slide-pagination" aria-label="页面导航">
        <button class="slide-dot active" data-slide-target="0" aria-label="第 1 页" aria-current="true"></button>
        <button class="slide-dot" data-slide-target="1" aria-label="第 2 页"></button>
    </nav>
    
    <script src="index.js"></script>
</body>
</html>
